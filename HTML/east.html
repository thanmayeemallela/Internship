<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#fffaf7;
    color:#333;
}

/* ================= NAVBAR ================= */

nav{
    width:100%;
    padding:15px 40px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    background:rgba(255,255,255,0.8);

    backdrop-filter:blur(6px);

    position:fixed;
    top:0;
    z-index:1000;
}

nav h1{
    color:#ff7b54;
}

nav ul{
    display:flex;
    gap:30px;

    list-style:none;
}

nav ul li a{
    text-decoration:none;
    color:#444;

    font-size:18px;

    transition:0.3s;
}

nav ul li a:hover{
    color:#ff7b54;
}

/* ================= HERO SECTION ================= */

.hero{
    width:100%;
    height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,0.5),
        rgba(0,0,0,0.5)
    ),

    url("https://images.unsplash.com/photo-1506744038136-46273834b3fb");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    padding:20px;
}

.hero-content h2{
    font-size:70px;
    color:#ffe066;

    margin-bottom:20px;
}

.hero-content p{
    font-size:24px;
    color:white;

    line-height:40px;
}

/* ================= ABOUT SECTION ================= */

.about{
    padding:80px 50px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:50px;

    flex-wrap:wrap;

    background:#fff0ea;
}

.about img{
    width:40%;
    height:420px;

    object-fit:cover;

    border-radius:20px;
}

.about-text{
    width:50%;
}

.about-text h2{
    font-size:42px;
    color:#ff7b54;

    margin-bottom:25px;
}

.about-text p{
    font-size:20px;

    line-height:36px;

    text-align:justify;
}

/* ================= TOURISM CARDS ================= */

.tourism{
    padding:80px 40px;

    text-align:center;

    background:#f4f9ff;
}

.tourism h2{
    font-size:42px;

    color:#4d96ff;

    margin-bottom:50px;
}

.card-container{
    display:flex;
    justify-content:center;

    flex-wrap:wrap;

    gap:30px;
}

.card{
    width:300px;

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 0 12px rgba(0,0,0,0.1);

    transition:0.4s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:220px;

    object-fit:cover;
}

.card h3{
    color:#ff7b54;

    margin:15px 0;
}

.card p{
    padding:0 15px 20px;

    line-height:28px;
}

.card a{
    text-decoration:none;
    color:black;
}

/* ================= FOOTER ================= */

footer{
    background:#222;

    color:white;

    text-align:center;

    padding:25px;

    font-size:18px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

    nav{
        flex-direction:column;

        gap:20px;
    }

    nav ul{
        flex-wrap:wrap;

        justify-content:center;
    }

    .hero-content h2{
        font-size:42px;
    }

    .hero-content p{
        font-size:18px;
    }

    .about{
        flex-direction:column;
    }

    .about img{
        width:100%;
    }

    .about-text{
        width:100%;
    }

}
    </style>
</head>
<body>
    <section class="hero">
    <div class="hero-content">
        <h2>East Godavari</h2>
        <p>Konaseema, temples, river beauty and Telugu traditions.</p>
    </div>
</section>

<div class="card-container">

    <div class="card">
        <a href="east-temples.html">
            <img src="temple-image">
            <h3>Temples</h3>
            <p>Famous temples and spiritual places.</p>
        </a>
    </div>

    <div class="card">
        <a href="east-rivers.html">
            <img src="river-image">
            <h3>Rivers</h3>
            <p>Godavari river and Konaseema landscapes.</p>
        </a>
    </div>

    <div class="card">
        <a href="east-food.html">
            <img src="food-image">
            <h3>Food</h3>
            <p>Traditional Andhra seafood and sweets.</p>
        </a>
    </div>

</div>
    
</body>
</html>
