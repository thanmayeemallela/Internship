<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:100%;
            height:100vh;
            background-color: aqua;
        }
        .blockx{
            border:1px solid black;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow:0px 2px 6px;
        }
        .blockx:hover{
            transform: scale(1.1);
            box-shadow: 0px 4px 12px rgba(244, 8, 8, 0.3);
        }
        .block1{
            width:100%;
            height:30vh;
            background-color: bisque;

            display:grid;
            grid-template-columns: 50% 50%;
        }
        .left1{
            background-color: aqua;
        }
        .right1{
            background-color:bisque;
        }

        .block2{
            width:100%;
            height:40vh;
            background-color:cadetblue;
            display:grid;
            grid-template-columns: 20% 60% 20%;
        }
        .left2{
            background-color:blue;
        }
        .middle2{
            background-color: blueviolet;
        }
        .right2{
            background-color:blue;
        }
        
        .block3{
            width:100%;
            height:30vh;
            background-color:blueviolet;
            display:grid;
            grid-template-columns: 30% 40% 30%;
        }
        .left3{
            background-color:brown;
        }
        .middle3{
            background-color:chartreuse;
        }
        .right3{
            background-color:brown;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="block1">
            <div class="left1 blockx"></div>
            <div class="right1 blockx"></div>
        </div>
        <div class="block2">
            <div class="left2 blockx"></div>
            <div class="middle2 blockx"></div>
            <div class="right2 blockx"></div>
        </div>
        <div class="block3 ">
            <div class="left3 blockx"></div>
            <div class="middle3 blockx"></div>
            <div class="right3 blockx"></div>
        </div>
    </div>
</body>
</html>
