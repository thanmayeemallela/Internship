<!DOCTYPE html>
<html>
<head>
    <title>Positive Negative Zero</title>
</head>
<body>

<h2>Positive Negative Zero</h2>

<script>

let num = Number(prompt("Enter a Number:"));

if (num > 0) {
    console.log(num + " is Positive");
}
else if (num < 0) {
    console.log(num + " is Negative");
}
else {
    console.log("Number is Zero");
}

</script>

</body>
</html>
