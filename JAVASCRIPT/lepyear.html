<!DOCTYPE html>
<html>
<head>
    <title>Leap Year</title>
</head>
<body>

<h2>Leap Year</h2>

<script>

let year = Number(prompt("Enter Year:"));

if ((year % 4 == 0 && year % 100 != 0) || (year % 400 == 0)) {
    console.log(year + " is a Leap Year");
}
else {
    console.log(year + " is Not a Leap Year");
}

</script>

</body>
</html>
