<!DOCTYPE html>
<html>
<head>
    <title>Temperature Check</title>
</head>
<body>

<h2>Temperature Check</h2>

<script>

let temperature = Number(prompt("Enter Temperature:"));

if (temperature > 40) {
    console.log("Too Hot");
}
else if (temperature >= 25 && temperature <= 40) {
    console.log("Normal Weather");
}
else {
    console.log("Cold Weather");
}

</script>

</body>
</html>
