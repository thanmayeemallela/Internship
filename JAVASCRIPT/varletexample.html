<!DOCTYPE html>
<html>
<head>
    <title>Variables</title>
</head>
<body>

<script>
console.log("VAR Example");

var name = "ABC";
console.log(name);

var name = "XYZ";
console.log(name);

name = "PQR";
console.log(name);

console.log("LET Example");

let city = "Rajahmundry";
console.log(city);

city = "Hyderabad";
console.log(city);

const nam="ABC";
console.log(nam);

nam="xyz";

</script>

</body>
</html>
