<!DOCTYPE html>
<html>
<head>
    <title>Divisible by 40</title>
</head>
<body>

<h2>Divisible by 5</h2>

<script>

let number = Number(prompt("Enter a Number:"));

if (number % 5 === 0) {
    console.log(number + " is Divisible by 40");
}
else {
    console.log(number + " is Not Divisible by 40");
}

</script>

</body>
</html>
